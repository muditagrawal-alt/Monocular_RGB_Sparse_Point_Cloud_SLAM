services:
  slam:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: monocular-slam:local
    ports:
      - "8000:8000"
    # Roughly matches the deployed container (4 cores / 2 GB on Modal), so
    # local timings are representative of production rather than of whatever
    # the dev machine happens to have.
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 2G
