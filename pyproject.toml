[project]
name = "monocular-slam"
version = "0.1.0"
description = "Monocular RGB sparse point-cloud SLAM with drift-corrected trajectory estimation"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true      # cv2 / gtsam ship no stubs
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running benchmark tests",
  "dataset: requires a downloaded dataset",
]
