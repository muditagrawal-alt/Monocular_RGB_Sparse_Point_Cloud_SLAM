[project]
name = "monocular-slam"
version = "0.1.0"
description = "Monocular RGB sparse point-cloud SLAM with drift-corrected trajectory estimation"
requires-python = ">=3.11,<3.13"

[tool.ruff]
line-length = 100
target-version = "py311"
# benchmarks/feasibility holds the throwaway scripts that produced the measured
# numbers quoted in the plan and README. They are kept exactly as run, as the
# record of those measurements, so they are not linted or maintained.
extend-exclude = ["benchmarks/feasibility"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true      # cv2 / gtsam ship no stubs
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "slow: long-running benchmark tests",
  "dataset: requires a downloaded dataset",
]

# opencv-python ships incomplete type stubs: they omit factory functions such as
# ORB_create and VideoWriter_fourcc, and cannot model the **kwargs call style used
# for optical flow. The few `type: ignore` comments on cv2 calls in slam/ are for
# these stub gaps, not for unsound code.
[[tool.mypy.overrides]]
module = ["cv2", "cv2.*"]
ignore_missing_imports = true
