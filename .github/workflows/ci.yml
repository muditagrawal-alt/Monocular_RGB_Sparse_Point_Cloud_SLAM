name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # gtsam publishes no wheels for 3.13+; the dependency set is pinned
          # against 3.11.
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check slam/ api/ tests/ benchmarks/

      - name: Type check
        run: mypy slam/ api/

      - name: Unit and integration tests
        run: pytest tests/ -q --deselect tests/performance

      - name: Performance budget
        # Requirement 6 is a deliverable, so a regression past realtime fails
        # the build rather than being noticed later.
        run: pytest tests/performance -q

  web:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  image:
    name: Container build
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platform: linux/amd64
          push: false
          tags: monocular-slam:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
